etap latar. Tiap foto tampil 45 detik: cukup lama agar tidak berkedip, cukup pendek agar panel tidak membakar satu citra.</text><clipPath id="c0"><rect x="52" y="646" width="348" height="146"/></clipPath><g clip-path="url(#c0)"><rect x="52.0" y="646.0" width="348.0" height="146.0" fill="url(#s1)" opacity="1.0"/><rect x="52.0" y="646.0" width="348.0" height="146.0" fill="url(#s2)" opacity="0.0"/></g><rect x="52" y="646" width="348" height="146" fill="none" stroke="#22304C" stroke-width="2"/><text x="52" y="820" font-family="Menlo, monospace" font-size="15" font-weight="400" fill="#7E8AA3" text-anchor="start">0 dtk · foto 1 · zoom 1.00</text><clipPath id="c1"><rect x="420" y="646" width="348" height="146"/></clipPath><g clip-path="url(#c1)"><rect x="410.43" y="641.985" width="367.14" height="154.03" fill="url(#s1)" opacity="1.0"/><rect x="410.43" y="641.985" width="367.14" height="154.03" fill="url(#s2)" opacity="0.0"/></g><rect x="420" y="646" width="348" height="146" fill="none" stroke="#22304C" stroke-width="2"/><text x="420" y="820" font-family="Menlo, monospace" font-size="15" font-weight="400" fill="#7E8AA3" text-anchor="start">44 dtk · zoom 1.055</text><clipPath id="c2"><rect x="788" y="646" width="348" height="146"/></clipPath><g clip-path="url(#c2)"><rect x="788.0" y="646.0" width="348.0" height="146.0" fill="url(#s1)" opacity="0.5"/><rect x="788.0" y="646.0" width="348.0" height="146.0" fill="url(#s2)" opacity="0.5"/></g><rect x="788" y="646" width="348" height="146" fill="none" stroke="#22304C" stroke-width="2"/><text x="788" y="820" font-family="Menlo, monospace" font-size="15" font-weight="400" fill="#7E8AA3" text-anchor="start">+600 ms · silang 50/50</text><clipPath id="c3"><rect x="1156" y="646" width="348" height="146"/></clipPath><g clip-path="url(#c3)"><rect x="1156.0" y="646.0" width="348.0" height="146.0" fill="url(#s1)" opacity="0.0"/><rect x="1156.0" y="646.0" width="348.0" height="146.0" fill="url(#s2)" opacity="1.0"/></g><rect x="1156" y="646" width="348" height="146" fill="none" stroke="#22304C" stroke-width="2"/><text x="1156" y="820" font-family="Menlo, monospace" font-size="15" font-weight="400" fill="#7E8AA3" text-anchor="start">+1200 ms · foto 2</text><clipPath id="c4"><rect x="1524" y="646" width="348" height="146"/></clipPath><g clip-path="url(#c4)"><rect x="1514.43" y="641.985" width="367.14" height="154.03" fill="url(#s1)" opacity="0.0"/><rect x="1514.43" y="641.985" width="367.14" height="154.03" fill="url(#s2)" opacity="1.0"/></g><rect x="1524" y="646" width="348" height="146" fill="none" stroke="#22304C" stroke-width="2"/><text x="1524" y="820" font-family="Menlo, monospace" font-size="15" font-weight="400" fill="#7E8AA3" text-anchor="start">89 dtk · siklus ulang</text><rect x="52" y="900" width="1816" height="2" fill="#22304C"/><text x="52.0" y="940" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#C9A227" text-anchor="start" letter-spacing="3.90">SCRIM DIHITUNG, BUKAN DITETAPKAN</text><text x="52.0" y="972" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">Alpha diambil dari persentil ke-95 luminansi foto, bukan</text><text x="52.0" y="998" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">rata-rata — yang merusak keterbacaan adalah bercak paling</text><text x="52.0" y="1024" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">terang. Scrim dinaikkan sampai kontras teks mencapai 4.5:1.</text><text x="668.6666666666666" y="940" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#C9A227" text-anchor="start" letter-spacing="3.90">SCRIM IKUT BERUBAH SAAT SLIDE BERGANTI</text><text x="668.6666666666666" y="972" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">Alpha di-tween bersamaan dengan silang-pudar. Tanpa itu,</text><text x="668.6666666666666" y="998" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">pindah dari foto malam ke foto siang membuat jam</text><text x="668.6666666666666" y="1024" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">menghilang selama satu detik penuh.</text><text x="1285.3333333333333" y="940" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#C9A227" text-anchor="start" letter-spacing="3.90">BATAS DEKODE &amp; CADANGAN</text><text x="1285.3333333333333" y="972" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">Bitmap dibatasi ukuran panel — foto 12 MP tidak muat di RAM</text><text x="1285.3333333333333" y="998" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">TV box. Bila berkas hilang atau rusak, layar jatuh ke warna</text><text x="1285.3333333333333" y="1024" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#B9C0CF" text-anchor="start">dasar tema; panel tidak pernah menampilkan bidang kosong.</text></svg>