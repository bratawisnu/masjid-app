<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="pb" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#FFF3D0"/><stop offset=".5" stop-color="#FFD79A"/><stop offset="1" stop-color="#E8B46C"/></linearGradient><linearGradient id="pm" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#5B7FA8"/><stop offset=".52" stop-color="#31465F"/><stop offset="1" stop-color="#1D2836"/></linearGradient><linearGradient id="pd" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#1A2436"/><stop offset=".55" stop-color="#0D1220"/><stop offset="1" stop-color="#05070C"/></linearGradient><linearGradient id="s1" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#2A3A24"/><stop offset="1" stop-color="#0F1712"/></linearGradient><linearGradient id="s2" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#4A2A2A"/><stop offset="1" stop-color="#1A0F12"/></linearGradient></defs><rect x="0" y="0" width="1920" height="1080" fill="#0B1220"/><text x="52" y="66" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="38" font-weight="600" fill="#F2EFE6" text-anchor="start" letter-spacing="3.80">BACKGROUND SLIDE DINAMIS</text><text x="52" y="100" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="19" font-weight="400" fill="#7E8AA3" text-anchor="start" letter-spacing="3.00">SCRIM TERUKUR PER-FOTO  ·  SILANG-PUDAR + KEN BURNS  ·  KONTRAS TEKS DIJAGA ≥ 4.5:1</text><rect x="52" y="122" width="1816" height="2" fill="#22304C"/><text x="52" y="168" font-family="Menlo, monospace" font-size="16" font-weight="400" fill="#C9A227" text-anchor="start">FOTO TERANG — luminansi p95 ≈ 0.88</text><rect x="52" y="184" width="588" height="260" fill="url(#pb)"/><rect x="52" y="184" width="588" height="260" fill="#0B1220" opacity="0.76"/><rect x="52" y="184" width="588" height="260" fill="none" stroke="#22304C" stroke-width="2"/><text x="72" y="226" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="18" font-weight="400" fill="#F2EFE6" text-anchor="start" letter-spacing="2.90">MASJID AL-FALAH</text><text x="72" y="418" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="40" font-weight="600" fill="#F2EFE6" text-anchor="start">17:24</text><text x="620" y="418" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="400" fill="#C9A227" text-anchor="end" letter-spacing="2.70">MAGHRIB 17:52</text><text x="52" y="474" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#7E8AA3" text-anchor="start">scrim 0.76 — langit cerah butuh peredupan paling kuat</text><text x="666" y="168" font-family="Menlo, monospace" font-size="16" font-weight="400" fill="#C9A227" text-anchor="start">FOTO SEDANG — luminansi p95 ≈ 0.54</text><rect x="666" y="184" width="588" height="260" fill="url(#pm)"/><rect x="666" y="184" width="588" height="260" fill="#0B1220" opacity="0.58"/><rect x="666" y="184" width="588" height="260" fill="none" stroke="#22304C" stroke-width="2"/><text x="686" y="226" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="18" font-weight="400" fill="#F2EFE6" text-anchor="start" letter-spacing="2.90">MASJID AL-FALAH</text><text x="686" y="418" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="40" font-weight="600" fill="#F2EFE6" text-anchor="start">17:24</text><text x="1234" y="418" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="15" font-weight="400" fill="#C9A227" text-anchor="end" letter-spacing="2.70">MAGHRIB 17:52</text><text x="666" y="474" font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="400" fill="#7E8AA3" text-anchor="start">scrim 0.58 — interior masjid, tekstur 